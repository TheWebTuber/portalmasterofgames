name: Generate Moon Calendar

on:
  push:
    branches:
      - main
    paths:
      - "js/calendar.js"
      - "js/moon.ics.cjs"
      - ".github/workflows/generate-moon-calendar.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate ICS calendar
        run: node js/moon.ics.cjs

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar/moon.ics

          if git diff --cached --quiet; then
            echo "Calendar already up to date."
            exit 0
          fi

          git commit -m "Update Howling Hours calendar"
          git push